# Galpón Mates en Render: el back, su base de datos y su Redis, definidos en un solo archivo
# (un "Blueprint"). En el panel de Render: New > Blueprint > elegir este repo. El paso a paso está
# en docs/DESPLIEGUE.md. La tienda y el dashboard tienen su propio Blueprint, en el repo del front.
#
# PLANES (identificadores de https://render.com/docs/blueprint-spec, precios de render.com/pricing
# al 2026-11-26). El back y la base van en plan pago: el back gratis se duerme a los 15 minutos sin
# visitas (no vencen pedidos ni salen mails mientras duerme) y la base gratis se borra a los 30
# días. El Redis sigue gratis: pierde las colas si se reinicia. Un recurso SIN línea "plan" no sale
# gratis: Render le pone el plan pago por omisión, así que cada uno lleva el suyo escrito.
services:
  # El back (NestJS), desde el Dockerfile de este repo. Al arrancar aplica las migraciones
  # (`npx prisma migrate deploy`) y, si la base está vacía, carga el catálogo inicial y crea el
  # admin del dashboard (SEED_IF_EMPTY, ADMIN_EMAIL y ADMIN_PASSWORD).
  - type: web
    name: galpon-mates-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb # 0,5 CPU y 512 MB, sin sueño: USD 7 por mes
    region: virginia
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    # Dominio propio del back. Render lo agrega al servicio y espera el registro del DNS (CNAME
    # `api` hacia la dirección onrender.com que muestra el servicio, en Cloudflare "DNS only"):
    # hasta que esté, sigue andando la dirección onrender.com. Un dominio no puede estar en dos
    # servicios a la vez: para mudarlo de cuenta, ver docs/MUDANZA-RENDER.md.
    domains:
      - api.galponmates.com.ar
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: LOG_LEVEL
        value: info

      # Conexiones: las completa Render con la base y el Redis de más abajo (red privada).
      - key: DATABASE_URL
        fromDatabase:
          name: galpon-mates-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: galpon-mates-redis
          property: connectionString

      # Direcciones públicas, sin barra final. Render las pide al crear el Blueprint y después se
      # cambian en Environment. Con el dominio propio (todo en Render):
      #   STORE_ORIGIN=https://galponmates.com.ar (la tienda)
      #   ADMIN_ORIGIN=https://admin.galponmates.com.ar (el dashboard; el único con CORS)
      #   PUBLIC_API_ORIGIN=https://api.galponmates.com.ar (este servicio; arma la URL del webhook)
      # Mientras la tienda y el dashboard sigan en Vercel: las direcciones vercel.app y
      # https://galpon-mates-api.onrender.com.
      - key: STORE_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false

      # Secretos compartidos con la tienda: los inventa Render. Después se copian a la tienda
      # (REVALIDATE_SECRET y API_PROXY_SECRET, en el Blueprint del front o en Vercel).
      - key: STORE_REVALIDATE_SECRET
        generateValue: true
      - key: TRUSTED_PROXY_SECRET
        generateValue: true
      # La IP del visitante para los límites por cliente cuando el pedido no trae el secreto (el
      # dashboard llamando directo desde el navegador): Cloudflare, que está delante de todos los
      # servicios de Render, la escribe en True-Client-IP pisando lo que mande el navegador. Lo
      # que reenvía la tienda con el secreto manda sobre esta cabecera.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: true-client-ip

      # Mercado Pago.
      - key: MP_MODE
        value: live
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_STATEMENT_DESCRIPTOR
        value: GALPON MATES

      # Fotos (Cloudinary).
      - key: MEDIA_MODE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Mails (SMTP).
      - key: MAIL_MODE
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      # Primera carga: con la base vacía, siembra el catálogo y crea este admin. Con datos, no
      # toca nada.
      - key: SEED_IF_EMPTY
        value: 'true'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Redis (Render Key Value): colas, sesiones y límites. Sin acceso desde internet y sin desalojo
  # (una cola no puede perder trabajos por falta de memoria).
  - type: keyvalue
    name: galpon-mates-redis
    plan: free # el pago más chico es 256mb (USD 10 por mes): guarda las colas en disco
    region: virginia
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Postgres 17, la misma versión con la que corren las pruebas.
  - name: galpon-mates-db
    plan: 0.1c-256mb # USD 6 por mes, con copias automáticas; la gratis se borraba a los 30 días
    # El disco se cobra aparte (USD 0,30 por GB al mes) y, si falta esta línea, Render pone 15 GB.
    # Vale 1 o un múltiplo de 5; se puede agrandar pero nunca achicar. La base pesa menos de 1 MB.
    diskSizeGB: 1
    region: virginia
    postgresMajorVersion: '17'
    databaseName: galpon
    user: galpon
